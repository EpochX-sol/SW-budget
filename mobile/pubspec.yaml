name: sw_budget
description: "SW-budget: Personal finance and AI budgeting app for Ethiopia"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Networking & Serialization
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.1
  intl: ^0.20.3

  # Local Database & Secure Storage
  drift: ^2.25.0
  sqlite3: ^2.5.0
  sqlcipher_flutter_libs: ^0.6.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Security & Biometrics
  local_auth: ^2.3.0
  cryptography: ^2.7.2
  crypto: ^3.0.3

  # Background Services & Permissions
  permission_handler: ^11.4.0
  workmanager: ^0.10.10
  connectivity_plus: ^6.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI, Charts & Icons
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17
  flutter_markdown: ^0.7.6+1

  # File Operations & Diagnostics
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  csv: ^6.0.0
  package_info_plus: ^8.3.0
  logger: ^2.5.0
  another_telephony: ^0.4.1
  pdf: ^3.13.1
  shelf: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/templates/
